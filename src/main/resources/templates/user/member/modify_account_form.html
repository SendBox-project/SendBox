<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User modify account</title>
    <link rel="stylesheet" href="../../../static/css/user/modify_account_form.css">
    <!--    <link rel="stylesheet" th:href="@{/css/user/modify_account_form.css}"/>-->
    <script type="text/javascript" src="../../../static/js/user/modify_account_form.js"></script>
</head>
<body>
<div id="modify_container">
    <h1>개인정보 수정</h1>
    <div id="modify_wrap">
        <form th:action="@{/정보수정되는 페이지}" th:method="post">
            <div class="form_list">
                <div class="form_item">
                    <label for="no"></label>
                    <input type="hidden" id="no" name="user_no" th:value="${loginedUserMemberDTO.user_no일걸}">
                </div>
                <div class="form_item">
                    <label for="id">아이디</label>
                    <input type="text" id="id" name="user_id" th:value="${loginedUserMemberDTO.user_id일걸}" readonly disabled>
                </div>
                <div class="form_item">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호입력">
                </div>
                <div class="form_item">
                    <label for="password_check">비밀번호 확인</label>
                    <input type="password" id="password_check" name="password_again" placeholder="비밀번호 재입력">
                </div>
                <div class="form_item">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" th:value="${loginedUserMemberDTO.name일걸}">
                </div>
                <div class="form_item">
                    <label for="mail">이메일</label>
                    <input type="email" id="mail" name="mail" th:value="${loginedUserMemberDTO.mail일걸}">
                </div>
            </div>
            <button class="modify_button" type="submit" th:onclick="@{보낼곳}">modify</button>
        </form>
    </div>
</div>

</body>
</html>
