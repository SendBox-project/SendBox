
<!--아작스를 통해 보여줄 화면 -->
<table class="board_content" cellspacing="0">
    <caption>장바구니</caption>
    <colgroup>
        <col width="80">
        <col>
        <col width="50">
        <col width="90">
        <col width="100">
        <col width="60">
    </colgroup>
    <thead>
    <tr>
        <th>매장명</th>
        <th>사용 시작일</th>
        <th>사용 종료일</th>
        <th>사이즈</th>
        <th>가격</th>
        <th>수량</th>
        <th>삭제</th>
        <th>수정</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:if="${cartList.totalElements != 0}">
        <tr th:each="cart : ${cartList}">
            <td th:text="${cart.room.store.storeName}"></td>
            <td><input id="startDate" name="startDate" th:value="${cart.startDate}" type="date"></td>
            <td><input id="endDate" name="endDate" th:value="${cart.endDate}" type="date"></td>
            <td><input id="size" name="size" th:value="${cart.room.size}" type="text"></td>
            <td><input id="totalPrice" name="totalPrice" th:value="${cart.totalPrice}" type="number"></td>
            <td th:text="${cart.totalAmount}"></td>
            <td><button type="button" th:onclick="|location.href='@{/user/onCart}'|">수정</button></td>
            <td><button type="button">삭제</button></td>
        </tr>
    </th:block>
    <th:block th:if="${cartList.totalElements == 0}">
        <tr style="text-align: center">
            <td colspan="8">장바구니 내역이 없습니다.</td>
        </tr>
    </th:block>
    </tbody>
</table>

<div class="buttons_wrap">
    <tr class="pagination"
        th:with="start=${(cartList.number div 10)*10 + 1},
           last=${(start + 9 < cartList.totalPages ? start + 9 : cartList.totalPages)}">
        <td>
            <a th:href="@{/user/reservationList(page=1)}" aria-label="First">
                <span aria-hidden="true">첫 페이지</span>
            </a>
        </td>

        <td th:class="${cartList.first} ? 'disabled'">
            <a th:href="${cartList.first} ? '#' : @{/user/reservationList(page=${reservations.number})}"
               aria-label="Previous">
                <span aria-hidden="true">&lt;</span>
            </a>
        </td>

        <th:block th:if="${last != 0}">
            <td th:each="page: ${#numbers.sequence(start, last)}"
                th:class="${page == cartList.number + 1} ? 'active'">
                <a th:text="${page}" th:href="@{/user/cartList(page=${page})}"></a>
            </td>
        </th:block>
        <th:block th:if="${last == 0}">
            <td class="active">
                <a th:text="1" th:href="@{/user/cartList(page=1)}"></a>
            </td>
        </th:block>

        <td th:class="${cartList.last} ? 'disabled'">
            <a th:href="${cartList.last} ? '#' : @{/user/cartList(page=${cartList.number + 2})}" aria-label="Next">
                <span aria-hidden="true">&gt;</span>
            </a>
        </td>

        <td>
            <a th:href="@{/user/cartList(page=${cartList.totalPages})}" aria-label="Last">
                <span aria-hidden="true">마지막 페이지</span>
            </a>
        </td>
    </tr>
</div>
