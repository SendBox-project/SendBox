<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="mb-3 row">
    <table class="table">
        <tr>
            <th>글 번호</th>
            <th>글쓴이</th>
        </tr>
        <tr th:each="order: ${reservations}">
            <td th:text="${order.orderNo}"></td>
            <td th:text="${order.reservationNum}"></td>
            <td th:text="${order.room.size}"></td>
            <td th:text="${order.room.store.phone}"></td>
        </tr>
    </table>

    <nav style="text-align: center;">
        <ul class="pagination"
            th:with="start=${(reservations.number div 10)*10 + 1},
            last=${(start + 9 < reservations.totalPages ? start + 9 : reservations.totalPages)}">
            <li>
                <a th:href="@{/user/reservationList(page=1)}" aria-label="First">
                    <span aria-hidden="true">First</span>
                </a>
            </li>

            <li th:class="${reservations.first} ? 'disabled'">
                <a th:href="${reservations.first} ? '#' : @{/user/reservationList(page=${reservations.number})}" aria-label="Previous">
                    <span aria-hidden="true">&lt;</span>
                </a>
            </li>

            <li th:each="page: ${#numbers.sequence(start, last)}" th:class="${page == reservations.number + 1} ? 'active'">
                <a th:text="${page}" th:href="@{/user/reservationList(page=${page})}"></a>
            </li>

            <li th:class="${reservations.last} ? 'disabled'">
                <a th:href="${reservations.last} ? '#' : @{/user/reservationList(page=${reservations.number + 2})}" aria-label="Next">
                    <span aria-hidden="true">&gt;</span>
                </a>
            </li>

            <li>
                <a th:href="@{/user/reservationList(page=${reservations.totalPages})}" aria-label="Last">
                    <span aria-hidden="true">Last</span>
                </a>
            </li>
        </ul>
    </nav>
</div>


</body>
</html>
