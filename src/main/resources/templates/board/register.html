<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
    <link th:inline="css" th:href="@{/css/board/noticeRegister.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="../../static/css/board/noticeRegister.css">

</head>
<body>
<div id="container board_container">
    <div class="form_wrap">
        <h1 class="board_title">새로운 게시글 등록</h1>
        <form action="/board/register" method="post" class="board_content">
            <div class="form_item">
                <label for="title">제&emsp;&emsp;&ensp; 목&ensp;&ensp;<span class="requiredDot">*</span></label>
                <input type="text" id="title" name="title" required placeholder="제목을 입력해주세요">
            </div><hr>
            <div class="form_item">
                <label for="content">내&emsp;&emsp;&ensp; 용&ensp;&ensp;<span class="requiredDot">*</span></label>
                <textarea id="content" name="content" required placeholder="내용을 입력해주세요"></textarea>
            </div>
            <div class="form_item">
                <label for="thumbnail">첨 부 파 일 &ensp;&ensp;</label>
                <input type="file" id="thumbnail" name="thumbnail" placeholder="첨부파일">
            </div>
<!--            <div class="form_item">-->
<!--                <label for="writerName">작&emsp;성&emsp;자&ensp; <span class="requiredDot">*</span></label>-->
<!--                <input type="text" id="writerName" name="writerName" required placeholder="작성자 이름을 입력해주세요">-->
<!--            </div>-->
            <input class="regi_button" type="submit" value="게시글 등록">
        </form>
    </div>
</div>
</body>
</html>
