<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
</head>

<h1>새로운 게시물 등록</h1>
<form action="/board/register" method="post">
    <label for="title">제목:</label><br>
    <input type="text" id="title" name="title" required><br>

    <label for="content">내용:</label><br>
    <textarea id="content" name="content" required></textarea><br>

    <label for="thumbnail">썸네일 URL:</label><br>
    <input type="text" id="thumbnail" name="thumbnail"><br>

    <label for="writerName">작성자 이름:</label><br>
    <input type="text" id="writerName" name="writerName" required><br>

    <label for="boardType">게시판 유형:</label><br>
    <select id="boardType" name="boardType">
        <option value="A">유형 A</option>
        <option value="B">유형 B</option>
        <option value="C">유형 C</option>
    </select><br>

    <input type="submit" value="제출">
</form>

</html>
