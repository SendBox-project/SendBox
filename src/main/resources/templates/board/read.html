<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../static/css/board/read.css">
    <link th:inline="css" th:href="@{/css/board/read.css}" rel="stylesheet"/>
</head>


<body id="board_container">
    <div class="read_wrap">
        <table class="board_content" cellspacing="0">
            <colgroup>
                <col width="20">
                <col width="20">
                <col width="40">
                <col width="200">
                <col width="40">
                <col width="60">
                <col width="40">
                <col width="70">
            </colgroup>
            <tr>
                <th>No.</th>
                <td th:text="${dto.boardNo}" class="read_td"></td>
                <th>제목</th>
                <td th:text="${dto.title}" class="read_td"></td>
                <th>작성자</th>
                <td th:text="${dto.writerName}" class="read_td"></td>
                <th>작성일</th>
                <td th:text="${#temporals.format(dto.regDate, 'yyyy/MM/dd HH:mm:ss')}" class="read_td"></td>
            </tr>
            <tr>
                <td colspan="8" class="read_td read_content">[[${dto.content}]]</td>
            </tr>
        </table>

        <a th:href="@{/board/modify(boardNo=${dto.boardNo}, page=${pageRequestDTO.page}, type=${pageRequestDTO.type})}">
            <button type="button" class="option_button">수정</button>
        </a>
        <a th:href="@{/board/noticeList}">
            <button type="button" class="option_button">목록</button>
        </a>
    </div>
</body>
</html>
