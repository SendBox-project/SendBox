<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
</head>



<h1 class="mt-4">공지사항 상세보기</h1>

<div class="form-group">
    <label >Title</label>
    <input type="text" class="form-control" name="title" th:value="${dto.title}" readonly >
</div>
<div class="form-group">
    <label >Writer</label>
    <input type="text" class="form-control" name="writer" th:value="${dto.writerName}" readonly>
</div>
<div class="form-group">
    <label >Cnt</label>
    <input type="text" class="form-control" name="cnt" th:value="${dto.cnt}" readonly>
</div>
<div class="form-group">
    <label >RegDate</label>
    <input type="text" class="form-control" name="regDate" th:value="${#temporals.format(dto.regDate, 'yyyy/MM/dd HH:mm:ss')}" readonly>
</div>
<div class="form-group">
    <label >Content</label>
    <textarea class="form-control" rows="5" name="content" readonly>[[${dto.content}]]</textarea>
</div>


<a th:href="@{/board/modify(boardNo = ${dto.boardNo}, page=${pageRequestDTO.page}, type=${pageRequestDTO.type}, keyword =${pageRequestDTO.keyword})}">
    <button type="button" class="btn btn-primary">Modify</button>
</a>

<a th:href="@{/board/list(page=${pageRequestDTO.page} , type=${pageRequestDTO.type}, keyword =${pageRequestDTO.keyword})}">
    <button type="button" class="btn btn-info">List</button>
</a>

<div >
    <div class="mt-4">
        <h5 ><span class="badge badge-info addAdminAnswer">Add AdminAnswer</span> </h5>
        <h5 ><span class="badge badge-secondary AdminAnswerCount"> AdminAnswer Count  [[${dto.AdminAnswerCount}]]</span> </h5>
    </div>
    <div class="list-group AdminAnswerList">

    </div>
</div>



<div class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modal title</h5>

                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input class="form-control"  type="text" name="AdminAnswerText" placeholder="AdminAnswer Text...">
                </div>
                <div class="form-group">
                    <input class="form-control"  type="text" name="AdminAnswer" placeholder="Replyer">
                    <input type="hidden" name="rno" >
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger AdminAnswerRemove">Remove</button>
                <button type="button" class="btn btn-warning AdminAnswerModify">Modify</button>
                <button type="button" class="btn btn-primary AdminAnswerSave">Save</button>
                <button type="button" class="btn btn-outline-secondary AdminAnswerClose" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    $(document).ready(function() {

        var boardNo = [[${dto.boardNo}]];

        var listGroup  = $(".AdminAnswerList");

        $(".AdminAnswerCount").click(function(){

            $.getJSON('/answer/board/'+boardNo, function(arr){

                console.log(arr);

            })//end getJSON

        })//end click


        //댓글이 추가될 영역
        var listGroup  = $(".AdminAnswerList");

//날짜 처리를 위한 함수
        function formatTime(str){
            var date = new Date(str);

            return date.getFullYear() + '/' +
                (date.getMonth() + 1) + '/' +
                date.getDate() + ' ' +
                date.getHours() + ':' +
                date.getMinutes();
        }

//특정한 게시글의 댓글을 처리하는 함수
        function loadJSONData() {
            $.getJSON('/answer/board/'+boardNo, function(arr){

                console.log(arr);

                var str ="";

                $('.AdminAnswerCount').html(" AdminAnswer Count  " + arr.length);

                $.each(arr, function(idx, adminAnswer){
                    console.log(adminAnswer);
                    str += '    <div class="card-body" data-answerNo="'+adminAnswer.answerNo+'"><b>'+adminAnswer.answerNo +'</b>';
                    str += '    <h5 class="card-title">'+adminAnswer.text+'</h5>';
                    str += '    <h6 class="card-subtitle mb-2 text-muted">'+adminAnswer.replyer+'</h6>';
                    str += '    <p class="card-text">'+ formatTime(adminAnswer.regDate) +'</p>';
                    str += '    </div>';
                })

                listGroup.html(str);

            });
        }

        $(".AdminAnswerCount").click(function(){

            loadJSONData();
        })//end click

        //모달 창
        var modal = $('.modal');

        $(".addAdminAnswer").click(function () {

            modal.modal('show');

            //댓글 입력하는 부분 초기화 시키기
            $('input[name="adminAnswerText"]').val('');
            $('input[name="replyer"]').val('');


            $(".modal-footer .btn").hide(); //모달 내의 모든 버튼을 안 보이도록
            $(".AdminAnswerSave, .AdminAnswerClose").show(); //필요한 버튼들만 보이도록

        });

        $(".AdminAnswerSave").click(function() {

            var adminAnswer = {
                boardNo: boardNo,
                text: $('input[name="adminAnswerText"]').val(),
                replyer: $('input[name="replyer"]').val()
            }
            console.log(reply);
            $.ajax({
                url: '/answer/',
                method: 'post',
                data:  JSON.stringify(adminAnswer),
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                success: function(data){
                    console.log(data);

                    var newAdminAnswerNo = parseInt(data);

                    alert(newAdminAnswerNo +"번 댓글이 등록되었습니다.")
                    modal.modal('hide');
                    loadJSONData();
                }
            })
        });

        $('.AdminAnswerList').on("click", ".card-body", function(){

            var adminAnswerNo = $(this).data("adminAnswerNo");

            $("input[name='adminAnswerText']").val( $(this).find('.card-title').html());
            $("input[name='replyer']").val( $(this).find('.card-subtitle').html());
            $("input[name='adminAnswerNo']").val(adminAnswerNo);

            $(".modal-footer .btn").hide();
            $(".AdminAnswerRemove, .AdminAnswerModify, .AdminAnswerClose").show();

            modal.modal('show');

        });

        $(".AdminAnswerRemove").on("click", function(){

            var adminAnswerNo = $("input[name='adminAnswerNo']").val(); //모달 창에 보이는 댓글 번호 hidden처리되어 있음

            $.ajax({
                url: '/answer/' + adminAnswerNo,
                method: 'delete',

                success: function(result){
                    console.log("result: " + result);
                    if(result ==='success'){
                        alert("댓글이 삭제되었습니다");
                        modal.modal('hide');
                        loadJSONData();
                    }
                }
            })
        });

        $(".AdminAnswerModify").click(function() {

            var adminAnswerNo = $("input[name='adminAnswerNo']").val();

            var adminAnswer = {
                adminAnswerNo: adminAnswerNo,
                boardNo: boardNo,
                text: $('input[name="adminAnswerText"]').val(),
                replyer: $('input[name="replyer"]').val()
            }

            console.log(adminAnswer);
            $.ajax({
                url: '/answer/' + adminAnswerNo,
                method: 'put',
                data:  JSON.stringify(adminAnswer),
                contentType: 'application/json; charset=utf-8',
                success: function(result){

                    console.log("RESULT: " + result);

                    if(result ==='success'){
                        alert("댓글이 수정되었습니다");
                        modal.modal('hide');
                        loadJSONData();
                    }
                }
            });
        });
    });
</script>
