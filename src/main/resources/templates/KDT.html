<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../static/css/common/common.css">
    <link rel="stylesheet" href="../static/css/KDT.css">
    <script type="text/javascript" th:src="@{/js/admin/login_form.js}"></script>
</head>
<body id="full_body">
<div id="login_container">
    <div class="side_logo"><a href="/주소"><img src="로고">로고 </a> </div>
    <h3> 로그인</h3>
    <div id="login_wrap">
        <form id="login_form">
            <div class="form_list">
                <div class="form_item">
                    <label for="id"></label>
                    <input type="text" id="id" name="adminId" placeholder="아이디를 입력하세요" autofocus>
                </div>
                <hr>
                <div class="form_item">
                    <label for="password"></label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
                </div>
            </div>
<!--            <div th:if="${error != null}" >-->
<!--                <div th:text="${exception}" style="color: red; text-align: center; margin-bottom: 10px">-->
<!--                </div>-->
<!--            </div>-->
            <button class="login_button" type="submit">로그인</button>
        </form>
        <div class="account_links">
            <a href="">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
</body>
</html>
