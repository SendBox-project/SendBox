<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin loginFrom</title>
    <link rel="stylesheet" th:href="@{/css/admin/login_form.css}"/>
    <script type="text/javascript" th:src="@{/js/admin/login_form.js}"></script>
    <link rel="stylesheet" th:href="@{/css/common/common.css}"/>
</head>
<body id="full_body">
<div id="login_container">
    <div class="side_logo"><a th:href="@{/admin/home}"><img th:src="@{/image/logo_orange_Removal.png}"> </a> </div>
    <h3> 어드민 로그인</h3>
    <div id="login_wrap">
        <form th:action="@{/admin/loginProc}" th:method="post" id="login_form">
            <div class="form_list">
                <div class="form_item">

                    <label for="id"></label>
                    <input type="text" id="id" name="adminId" placeholder="아이디를 입력하세요" autofocus>
                </div>
                <hr>
                <div class="form_item">
                    <label for="password"></label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
                </div>
            </div>
            <button class="login_button" type="submit" onclick="adminLoginForm()">로그인</button>
        </form>
        <div class="account_links">
            <a th:href="@{/admin/forgot_id}">아이디 찾기</a>
            <a th:href="@{/admin/reset_password_form}">비밀번호 찾기</a>
            <a th:href="@{/admin/terms}">회원가입</a>
        </div>
        <div class="account_links">
            <a th:href="@{/user/login}">유저 로그인</a>
            <a th:href="@{/owner/login}">오너 로그인</a>
        </div>
    </div>
</div>
</body>
</html>
