<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1 class="mt-4">Inquary Modify Page</h1>

    <form action="/inquary/modify" method="post">

        <input type="hidden" name="page" th:value="${pageRequestDTO2.page}">
        <input type="hidden" name="type" th:value="${pageRequestDTO2.type}">
        <input type="hidden" name="keyword" th:value="${pageRequestDTO2.keyword}">

        <div class="form-group">
            <label for="inquaryNo">InquaryNo</label>
            <input type="text" class="form-control" id="inquaryNo" name="inquaryNo" th:value="${dto.inquaryNo}" readonly>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" th:value="${dto.title}">
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea class="form-control" rows="5" id="content" name="content" th:text="${dto.content}"></textarea>
        </div>

        <div class="form-group">
            <label for="member">Writer</label>
            <input type="text" class="form-control" id="member" name="member" th:value="${dto.memberName}" readonly>
        </div>

        <div class="form-group">
            <label for="regDate">RegDate</label>
            <input type="text" class="form-control" id="regDate" th:value="${#temporals.format(dto.regDate, 'yyyy/MM/dd HH:mm:ss')}" readonly>
        </div>

        <div class="form-group">
            <label for="modDate">수정일자</label>
            <input type="text" class="form-control" id="modDate" th:value="${#temporals.format(dto.modDate, 'yyyy/MM/dd HH:mm:ss')}" readonly>
        </div>

        <button type="submit" class="btn btn-primary modifyBtn">Modify</button>
        <button type="button" class="btn btn-info listBtn">List</button>
        <button type="button" class="btn btn-danger removeBtn">Remove</button>

    </form>


    <script th:inline="javascript">

        var actionForm = $("form"); //form 태그 객체

        $(".removeBtn").click(function(){

            actionForm
                .attr("action", "/inquary/remove")
                .attr("method","post");

            actionForm.submit();

        });

        $(".modifyBtn").click(function() {

            if(!confirm("수정하시겠습니까?")){
                return ;
            }

            actionForm
                .attr("action", "/inquary/modify")
                .attr("method","post")
                .submit();
        });

        $(".listBtn").click(function() {

            //var pageInfo = $("input[name='page']");
            var page = $("input[name='page']");
            var type = $("input[name='type']");
            var keyword = $("input[name='keyword']");

            actionForm.empty(); //form 태그의 모든 내용을 지우고

            actionForm.append(page);
            actionForm.append(type);
            actionForm.append(keyword);


            actionForm
                .attr("action", "/inquary/list")
                .attr("method","get");

            actionForm.submit();

        })

    </script>
</body>
</html>
