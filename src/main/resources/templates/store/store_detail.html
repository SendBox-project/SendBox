<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
      layout:fragment="Content">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<!--    <link rel="stylesheet" href="../../static/css/store/storeDetail.css">-->
    <link th:inline="css" th:href="@{/css/store/storeDetail.css}" rel="stylesheet"/>
</head>
<body>
<div id="container" class="store_container">
    <div class="store_name">
        <p th:text="@{${store.storeName}}">가게이름</p>
    </div>
    <div class="detail_col1">
        <div class="detail_row1">
            <div class="thumbnail">
                <img th:src="@{'/upload/'+${thumbnailUrl}}" alt="썸네일">
            </div>
            <div class="review">
<!--                    <p th:each="review : ${store.review}" th:text="${review.content}">리뷰입니다</p>-->
            </div>
        </div> <!-- detail_row1 -->
        <div class="detail_row2">
            <div class="order_tap">
                <form th:action="@{/?}" th:method="post" id="order_form">
                    <div class="form_list">
                        <div class="form_item">
                            <label for="startDate">시작날짜</label>
                            <input type="date" id="startDate" name="startDate">
                        </div>
                        <div class="form_item">
                            <label for="endDate">종료날짜</label>
                            <input type="date" id="endDate" name="endDate">
                        </div>
                        <div class="form_item">
                            <label for="order_size">사이즈</label>
                            <select id="order_size" name="totalAmount">
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                            </select>
                        </div><hr>
                        <div class="form_item">
                           <span>총 가격</span>
                        </div>
                    </div><hr>
                    <button class="detail_button" type="submit" onclick="">결제하기</button>
                    <button class="detail_button" type="submit" onclick="">장바구니</button>
                </form>
            </div>

        </div> <!-- detail_row2 -->
    </div> <!-- detail_col1 --><hr>
    <div class="detail_col2">
        <div class="visual_title">
            <p>상세페이지</p>
        </div>
        <div class="detail_img">
            <img th:src="@{'/upload/'+${infoPhotoUrl}}" alt="상세이미지">
        </div>
    </div> <!-- detail_col2 --> <hr>
    <div class="detail_col3">
        <div class="detail_info">
            <div class="detail_notice">
                <h2>가게 공지</h2>
                <p th:text="${store.notice}">가게공지</p>
                <span>전화번호 : </span> <p th:text="${store.phone}">전화번호</p>
            </div>
            <div class="detail_address">
                <p th:text="${store.address}">주소</p>
            </div>
        </div> <!-- detail_info -->
    </div> <!-- detail_col3 -->
</div> <!-- container -->
</body>
</html>
